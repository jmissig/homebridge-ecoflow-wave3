name: Feature request
description: Suggest a focused WAVE 3 improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user need would this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing Matter behavior or workarounds where relevant.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Include sanitized controller or hardware evidence if available.

  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: This request is specifically for the EcoFlow WAVE 3.
          required: true

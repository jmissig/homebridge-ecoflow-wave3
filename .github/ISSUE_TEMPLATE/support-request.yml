name: Support request
description: Ask for help configuring or using the plugin
title: "[Support]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Do not include EcoFlow credentials, tokens, MQTT credentials, full
        serial numbers, private MQTT topics, or raw payloads.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is blocking you?
      description: Include what you tried and the result.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste the smallest relevant excerpt, or write "None".
      render: shell
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      placeholder: 0.4.0 or a commit SHA
    validations:
      required: true

  - type: input
    id: homebridge-version
    attributes:
      label: Homebridge version
      placeholder: Output of homebridge -V
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: Output of node -v
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Homebridge image, Docker, macOS, Linux, or Windows
    validations:
      required: true

  - type: checkboxes
    id: sanitization
    attributes:
      label: Sensitive information
      options:
        - label: I removed credentials, identifiers, private topics, and raw payloads.
          required: true
